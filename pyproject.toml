[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-tree"
version = "0.1.0"
description = "High-Throughput Test-Time Compute Scaling via Step-Level MCTS & KV-Cache Prefix Recycling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Hrushikesh Ramilla", email = "ramillahrushikesh@gmail.com"}
]
keywords = [
    "test-time-compute",
    "mcts",
    "process-reward-models",
    "speculative-decoding",
    "kv-cache-optimization",
    "reasoning-scaling",
    "llm-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.20.0",
    "torch>=2.0.0",
    "transformers>=4.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = [
    "tests",
]
pythonpath = ["."]
